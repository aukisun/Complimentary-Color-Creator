<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Complementary Colors Creator</title>
<meta name="description" content="Build complementary color palettes from a HEX code, a color picker or a photo. By Nuforms Lab.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23CCFF00'/%3E%3Ctext x='42' y='76' text-anchor='middle' font-family='Helvetica Neue,Arial,sans-serif' font-weight='800' font-size='74' letter-spacing='-2' fill='%23111'%3EC%3C/text%3E%3Ctext x='80' y='42' text-anchor='middle' font-family='Helvetica Neue,Arial,sans-serif' font-weight='800' font-size='34' fill='%23111'%3E3%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23CCFF00'/%3E%3Ctext x='42' y='76' text-anchor='middle' font-family='Helvetica Neue,Arial,sans-serif' font-weight='800' font-size='74' letter-spacing='-2' fill='%23111'%3EC%3C/text%3E%3Ctext x='80' y='42' text-anchor='middle' font-family='Helvetica Neue,Arial,sans-serif' font-weight='800' font-size='34' fill='%23111'%3E3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: one quiet room — brand top-left, a three-way input switch, then the palette as overlapping capsules. */
:root{
  --h: 42;                       /* hue of the current base color, set by JS */
  --brand-l: #8A3A1E;            /* brand ink for light ground, set by JS */
  --brand-d: #F0C27A;            /* brand ink for dark ground, set by JS */
  --bg: hsl(var(--h) 48% 87%);
  --ink: hsl(var(--h) 25% 14%);
  --muted: hsl(var(--h) 14% 38%);
  --line: hsl(var(--h) 25% 72%);
  --field: hsl(var(--h) 50% 92%);
  --brand: var(--brand-l);
  --btn: hsl(var(--h) 32% 30%);
  --btn-hover: hsl(var(--h) 34% 24%);
  --btn-ink: hsl(var(--h) 48% 92%);
  --display: 'Syne', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Space Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: hsl(var(--h) 16% 8%);
    --ink: hsl(var(--h) 20% 90%);
    --muted: hsl(var(--h) 10% 62%);
    --line: hsl(var(--h) 12% 24%);
    --field: hsl(var(--h) 14% 12%);
    --brand: var(--brand-d);
    --btn: hsl(var(--h) 22% 26%);
    --btn-hover: hsl(var(--h) 24% 32%);
    --btn-ink: hsl(var(--h) 40% 88%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg: hsl(var(--h) 16% 8%);
  --ink: hsl(var(--h) 20% 90%);
  --muted: hsl(var(--h) 10% 62%);
  --line: hsl(var(--h) 12% 24%);
  --field: hsl(var(--h) 14% 12%);
  --brand: var(--brand-d);
  --btn: hsl(var(--h) 22% 26%);
  --btn-hover: hsl(var(--h) 24% 32%);
  --btn-ink: hsl(var(--h) 40% 88%);
  color-scheme: dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;
  background:var(--bg); color:var(--ink);
  font-family:var(--mono); font-size:13px;
  padding-inline:clamp(16px,4vw,64px); padding-block:28px 48px;
  transition:background-color .8s ease;
}

header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;color:var(--brand);transition:color .8s ease}
.brand-mark{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;letter-spacing:-.04em}
.brand-mark sup{font-size:.42em;vertical-align:top;position:relative;top:-.08em;margin-left:.04em;letter-spacing:0}
.brand-name{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.theme-btn{
  font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:6px 12px;cursor:pointer;
}
.theme-btn:hover{color:var(--ink)}

/* Mode switch */
.modes{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:56px}
.modes .sep{width:1px;height:14px;background:var(--line)}
.mode{
  font-family:var(--mono);font-size:13px;letter-spacing:.06em;
  background:none;border:0;padding:4px 2px;cursor:pointer;color:var(--muted);
  border-bottom:1px solid transparent;
}
.mode:hover{color:var(--ink)}
.mode[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
button:focus,label:focus,.drop:focus{outline:none}
body.kbd button:focus-visible,body.kbd label:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Input panels — fixed height so the stage never jumps */
.panels{height:136px;display:grid;place-items:center;margin-top:14px}
.panel{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}

.code-field{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--field);
  border-radius:999px;padding:10px 10px 10px 18px;
}
.code-field span{color:var(--muted);font-size:16px}
#hexInput{
  font-family:var(--mono);font-size:16px;letter-spacing:.08em;text-transform:uppercase;
  width:7.5ch;border:0;background:transparent;color:var(--ink);outline:none;
}
.chip{width:22px;height:22px;border-radius:50%;background:var(--accent,#EBC05A);border:1px solid rgba(0,0,0,.12)}
.go{
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  border:0;border-radius:999px;padding:9px 16px;cursor:pointer;
  background:var(--btn);color:var(--btn-ink);
  transition:background-color .3s ease;
}
.go:hover{background:var(--btn-hover)}

.drop{
  display:flex;align-items:center;gap:14px;cursor:pointer;
  border:1px solid var(--line);background:var(--field);border-radius:999px;
  padding:10px 22px 10px 10px;color:var(--muted);transition:border-color .2s;
}
.drop.over{border-color:var(--ink);color:var(--ink)}
.drop .thumb{width:40px;height:40px;border-radius:50%;background:var(--line) center/cover;flex:none}
.drop b{color:var(--ink);font-weight:400}

.picker{display:flex;flex-direction:column;gap:10px;width:300px;max-width:100%}
#sv{width:100%;height:92px;border-radius:14px;cursor:crosshair;display:block;touch-action:none}
#hue{
  -webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:999px;outline:none;
  background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
}
#hue::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.4);cursor:pointer}
#hue::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.4);cursor:pointer}

/* Accordion state + rail */
.label{transition:opacity .35s ease}
.stage.focusing .pill .label{opacity:.38}
.stage.focusing .pill.on .label{opacity:1}
.pill.on{box-shadow:0 22px 50px -14px rgba(20,8,0,.45)}

.flyer{position:fixed;z-index:500;border-radius:50%;pointer-events:none;box-shadow:0 10px 30px -8px rgba(0,0,0,.4)}
.code-field.landed{animation:landed .5s cubic-bezier(.2,.8,.2,1)}
@keyframes landed{0%{box-shadow:0 0 0 0 var(--accent)}40%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}

/* Reference weights */
.weights{max-width:1180px;margin:72px auto 0;display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:40px;align-items:center}
.weights[hidden]{display:none}
.ref{display:flex;flex-direction:column;gap:10px;min-width:0}
.ref-img{width:100%;aspect-ratio:4/5;border-radius:18px;background:var(--line) center/cover;max-width:100%}
.ref-cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field{position:relative;height:380px;min-width:0}
.orb{position:absolute;border-radius:50%;cursor:pointer;-webkit-user-select:none;user-select:none;
  box-shadow:0 18px 36px -16px rgba(20,8,0,.45);
  animation:levitate var(--dur,7s) ease-in-out var(--delay,0s) infinite alternate;
  transition:box-shadow .3s}
.orb:hover{box-shadow:0 24px 44px -14px rgba(20,8,0,.55)}
.orb:focus{outline:none}
body.kbd .orb:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.orb{display:grid;place-items:center}
.orb-tag{display:flex;flex-direction:column;align-items:center;gap:.25em;text-align:center;pointer-events:none;
  font-variant-numeric:tabular-nums;line-height:1}
.orb-tag b{font-family:var(--display);font-weight:700;letter-spacing:-.02em}
.orb-tag span{font-size:10px;letter-spacing:.08em;opacity:.78}
@keyframes levitate{
  0%{translate:0 calc(var(--amp,8px) * -1)}
  50%{translate:var(--sway,3px) 0}
  100%{translate:0 var(--amp,8px)}
}
@media (max-width:640px){
  .weights{grid-template-columns:1fr;gap:20px;margin-top:48px}
  .ref{flex-direction:row;align-items:center}
  .ref-img{width:72px;aspect-ratio:1;border-radius:12px;flex:none}
  .field{height:300px}
}

/* Harmony row */
.harmonies{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;margin-top:4px}
.harm{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:0;padding:4px 0;cursor:pointer;color:var(--muted);
}
.harm:hover{color:var(--ink)}
.harm[aria-pressed="true"]{color:var(--ink)}
.harm[aria-pressed="true"]::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent,#EBC05A);margin-right:7px;vertical-align:1px;box-shadow:0 0 0 1px var(--line)}

/* Stage of capsules */
.stage{position:relative;margin:24px auto 0;max-width:1180px;width:100%}
.pill{
  position:absolute;border-radius:9999px;cursor:pointer;
  box-shadow:16px 0 34px -10px rgba(20,8,0,.35);
  transform-origin:50% 100%;will-change:transform;
  transition:background-color .7s cubic-bezier(.2,.7,.2,1),left .5s,top .5s,width .5s,height .5s;
  animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
}
.stage.vertical .pill{box-shadow:0 16px 30px -10px rgba(20,8,0,.35)}
.pill{transform-origin:50% 50%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.pill:focus{outline:none}
body.kbd .pill:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.stage.vertical .pill{transform-origin:50% 50%}
@keyframes rise{from{translate:0 40px;opacity:0}to{translate:0 0;opacity:1}}

.label{
  position:absolute;display:flex;flex-direction:column;gap:4px;
  font-size:11px;line-height:1.35;pointer-events:none;
  font-variant-numeric:tabular-nums;
}
.label .hex{font-size:14px;font-weight:700;letter-spacing:.04em}
.label .name{opacity:.82}
.label .base{
  align-self:flex-start;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid currentColor;border-radius:999px;padding:1px 6px;margin-bottom:4px;opacity:.85;
}
.stage.vertical .label{flex-direction:row;flex-wrap:wrap;align-items:baseline;column-gap:14px}
.stage.vertical .label .base{margin:0}

.foot{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 22px;margin-top:44px;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.foot button{font:inherit;background:none;border:0;color:inherit;cursor:pointer;letter-spacing:inherit;text-transform:inherit;padding:0}
.foot button:hover{color:var(--ink)}

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:12px;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
  .modes{margin-top:36px}
  .brand-mark{font-size:36px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header>
  <div class="brand" aria-label="C cubed, Complementary Colors Creator">
    <div class="brand-mark" aria-hidden="true">C<sup>3</sup></div>
    <span class="brand-name">Complementary Colors Creator</span>
  </div>
  <button class="theme-btn" id="themeBtn" type="button">Dark</button>
</header>

<nav class="modes" role="tablist" aria-label="Choose how to set the base color">
  <button class="mode" role="tab" id="tab-upload" data-mode="upload" aria-selected="false">Upload</button>
  <span class="sep"></span>
  <button class="mode" role="tab" id="tab-code" data-mode="code" aria-selected="true">Code</button>
  <span class="sep"></span>
  <button class="mode" role="tab" id="tab-picker" data-mode="picker" aria-selected="false">Picker</button>
</nav>

<div class="panels">
  <div class="panel" id="panel-code">
    <div class="code-field">
      <span>#</span>
      <input id="hexInput" maxlength="7" value="EBC05A" spellcheck="false" autocomplete="off" aria-label="HEX color">
      <div class="chip" aria-hidden="true"></div>
    </div>
    <button class="go" id="goBtn" type="button">Generate</button>
  </div>

  <div class="panel" id="panel-upload" hidden>
    <label class="drop" id="drop" for="fileInput" tabindex="0">
      <span class="thumb" id="thumb"></span>
      <span><b>Drop a photo</b> or click to choose</span>
    </label>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <div class="panel" id="panel-picker" hidden>
    <div class="picker">
      <canvas id="sv" width="600" height="184" aria-label="Saturation and brightness"></canvas>
      <input type="range" id="hue" min="0" max="359" value="42" aria-label="Hue">
    </div>
  </div>
</div>

<nav class="harmonies" id="harmonies" aria-label="Harmony"></nav>

<section class="stage" id="stage" aria-label="Generated palette"></section>

<div class="foot">
  <button type="button" id="copySvg">Copy SVG</button>
  <button type="button" id="copyCss">Copy CSS</button>
  <button type="button" id="copyJson">Copy JSON</button>
</div>

<section class="weights" id="weights" hidden aria-label="Color weight of the reference photo">
  <div class="ref">
    <div class="ref-img" id="refImg"></div>
    <span class="ref-cap">Reference · color weight</span>
  </div>
  <div class="field" id="field"></div>
</section>


<div class="toast" id="toast"></div>

<script>
/* ---------- color math ---------- */
function hexToRgb(hex){hex=hex.replace('#','');return{r:parseInt(hex.slice(0,2),16),g:parseInt(hex.slice(2,4),16),b:parseInt(hex.slice(4,6),16)}}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase()}
function hexToHSL(hex){
  let{r,g,b}=hexToRgb(hex);r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);let h=0,s=0;const l=(max+min)/2;
  if(max!==min){const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);
    h=max===r?(g-b)/d+(g<b?6:0):max===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  return{h,s:s*100,l:l*100};
}
function hslToHex(h,s,l){
  h=((h%360)+360)%360;s/=100;l/=100;
  const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return rgbToHex(f(0)*255,f(8)*255,f(4)*255);
}
function hsvToHex(h,s,v){const l=v*(1-s/2);const sl=(l===0||l===1)?0:(v-l)/Math.min(l,1-l);return hslToHex(h,sl*100,l*100)}
function luminance(hex){const{r,g,b}=hexToRgb(hex);const c=[r,g,b].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function toLab(hex){
  const{r,g,b}=hexToRgb(hex);
  const lin=[r,g,b].map(v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  const x=(lin[0]*.4124+lin[1]*.3576+lin[2]*.1805)/.95047,y=lin[0]*.2126+lin[1]*.7152+lin[2]*.0722,z=(lin[0]*.0193+lin[1]*.1192+lin[2]*.9505)/1.08883;
  const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;
  return[116*f(y)-16,500*(f(x)-f(y)),200*(f(y)-f(z))];
}
function dE(a,b){const A=toLab(a),B=toLab(b);return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2])}

/* ---------- names ---------- */
// Pantone Colors of the Year (TCX), shown only when a swatch is a close match.
const PANTONE=[
  ['15-4020','Cerulean','#9BB7D4'],['17-2031','Fuchsia Rose','#C74375'],['19-1664','True Red','#BF1932'],
  ['14-4811','Aqua Sky','#7BC4C4'],['17-1456','Tigerlily','#E2583E'],['15-5217','Blue Turquoise','#53B0AE'],
  ['13-1106','Sand Dollar','#DECDBE'],['19-1557','Chili Pepper','#9B1B30'],['18-3943','Blue Iris','#5A5B9F'],
  ['14-0848','Mimosa','#F0C05A'],['15-5519','Turquoise','#45B5AA'],['18-2120','Honeysuckle','#D94F70'],
  ['17-1463','Tangerine Tango','#DD4124'],['17-5641','Emerald','#009473'],['18-3224','Radiant Orchid','#B163A3'],
  ['18-1438','Marsala','#955251'],['13-1520','Rose Quartz','#F7CAC9'],['15-3919','Serenity','#92A8D1'],
  ['15-0343','Greenery','#88B04B'],['18-3838','Ultra Violet','#5F4B8B'],['16-1546','Living Coral','#FF6F61'],
  ['19-4052','Classic Blue','#0F4C81'],['13-0647','Illuminating','#F5DF4D'],['17-5104','Ultimate Gray','#939597'],
  ['17-3938','Very Peri','#6667AB'],['18-1750','Viva Magenta','#BB2649'],['13-1023','Peach Fuzz','#FFBE98'],
  ['17-1230','Mocha Mousse','#A47864']
];
const NAMES=[
  ['Ivory','#FFFFF0'],['Bone','#E3DCCB'],['Cream','#F3E5C0'],['Sand','#D8C3A0'],['Wheat','#E9C98B'],['Butter','#F3D46B'],
  ['Saffron','#EBB43A'],['Mustard','#D9A62E'],['Ochre','#CC7722'],['Apricot','#F2A66B'],['Peach','#F7B89A'],['Coral','#F27B67'],
  ['Tangerine','#EE7F2D'],['Terracotta','#C8603E'],['Sienna','#A0522D'],['Rust','#B7410E'],['Brick','#A23A2A'],['Vermilion','#D83A24'],
  ['Crimson','#B0182C'],['Oxblood','#5B1A1A'],['Burgundy','#6E1E2D'],['Wine','#4E1A22'],['Plum','#6B2D5C'],['Mauve','#B07A9A'],
  ['Blush','#E8B4B8'],['Rose','#D96C86'],['Magenta','#B8336A'],['Lilac','#C4A9D8'],['Lavender','#A99BD6'],['Violet','#6A4BA0'],
  ['Indigo','#3B3A7A'],['Navy','#1E2A4A'],['Cobalt','#1F4FA0'],['Azure','#3A8FD8'],['Sky','#A7CCE8'],['Teal','#1F7A7A'],
  ['Aqua','#7BCFC8'],['Mint','#A8DCC0'],['Sage','#9CAF88'],['Olive','#707A3A'],['Moss','#5A6B2F'],['Forest','#21462E'],
  ['Jade','#1E8A5A'],['Chartreuse','#B5D334'],['Lime','#C8E06A'],['Charcoal','#2E2E30'],['Graphite','#4A4B4F'],['Slate','#6A7682'],
  ['Stone','#A8A196'],['Espresso','#3A2620'],['Cocoa','#6B4432'],['Umber','#7A4B2A'],['Tan','#C9A27A'],['Ink','#14161C']
];
function describe(hex){
  let best=null,bd=1e9;
  for(const p of PANTONE){const d=dE(hex,p[2]);if(d<bd){bd=d;best=p}}
  if(bd<9) return{pantone:'PANTONE '+best[0],name:best[1]};
  let n=NAMES[0],nd=1e9;for(const c of NAMES){const d=dE(hex,c[1]);if(d<nd){nd=d;n=c}}
  return{pantone:null,name:n[0]};
}

/* ---------- palette engine (from the live site: colorHuntPalette + harmonies) ---------- */
// ColorHunt-style 4-step: hero → rich mid → deep mid → dark anchor in the partner hue.
function colorHuntPalette(h,s,l,anchorH){
  const midShift=(anchorH-h+540)%360-180;
  return[
    hslToHex(h,s,l),
    hslToHex(h+midShift*.1,Math.min(s*.92,88),Math.max(l*.58,25)),
    hslToHex(h+midShift*.28,Math.min(s*.72,75),Math.max(l*.34,16)),
    hslToHex(anchorH,Math.min(s*.6,55),Math.max(l*.1,7)),
  ];
}
const tint=(h,s,l)=>hslToHex(h,s*.35,Math.min(l+(100-l)*.55,90));
const wrap=(x)=>((x%360)+360)%360;

// Every harmony yields 8 colors, base color always in slot 1.
const HARMONIES={
  complementary:{name:'Complementary',build(h,s,l){
    const c=wrap(h+180),A=colorHuntPalette(h,s,l,c),B=colorHuntPalette(c,s*.9,l,h);
    return[tint(h,s,l),A[0],A[1],A[2],B[0],B[1],B[2],B[3]];}},
  analogous:{name:'Analogous',build(h,s,l){
    const a=wrap(h-30),b=wrap(h+30),B=colorHuntPalette(b,s,l,wrap(b+180));
    return[tint(a,s,l),hslToHex(h,s,l),hslToHex(a,s*.9,l*.9),B[0],B[1],colorHuntPalette(h,s,l,b)[2],B[2],B[3]];}},
  triadic:{name:'Triadic',build(h,s,l){
    const t2=wrap(h+120),t3=wrap(h+240);
    const A=colorHuntPalette(h,s,l,t2),B=colorHuntPalette(t2,s*.85,l,t3),C=colorHuntPalette(t3,s*.75,l,h);
    return[tint(h,s,l),A[0],A[1],B[0],B[1],C[0],C[2],A[3]];}},
  split:{name:'Split',build(h,s,l){
    const a=wrap(h+150),b=wrap(h+210);
    const A=colorHuntPalette(h,s,l,a),B=colorHuntPalette(a,s*.85,l,h),C=colorHuntPalette(b,s*.8,l,h);
    return[tint(h,s,l),A[0],A[1],B[0],B[1],C[0],C[2],B[3]];}},
  tetradic:{name:'Tetradic',build(h,s,l){
    const q2=wrap(h+90),q3=wrap(h+180),q4=wrap(h+270);
    const A=colorHuntPalette(h,s,l,q3),B=colorHuntPalette(q2,s*.85,l,q4),C=colorHuntPalette(q3,s*.8,l,h);
    return[tint(h,s,l),A[0],A[1],B[0],B[1],C[0],C[2],hslToHex(q4,Math.min(s*.6,55),Math.max(l*.12,7))];}},
  mono:{name:'Mono',build(h,s,l){
    return[hslToHex(h,s*.2,94),hslToHex(h,s,l),hslToHex(h,s*.85,Math.max(l*.72,22)),hslToHex(h,s*.4,Math.min(l+20,82)),
      hslToHex(h,Math.min(s*1.1,100),Math.max(l*.45,14)),hslToHex(h,s*.3,Math.max(l*.6,30)),hslToHex(h,s*.6,Math.max(l*.2,9)),hslToHex(h,8,10)];}},
};
let harmony='complementary';
let photo=null;   // {colors:[hex…], base:index} from the last uploaded image
function buildPalette(base){
  const{h,s,l}=hexToHSL(base);
  const cols=HARMONIES[harmony].build(h,s,l);
  cols[1]=base.toUpperCase();
  return cols;
}

/* ---------- image extraction (k-means++) ---------- */
function extract(img,k=8){
  const c=document.createElement('canvas'),sc=Math.min(1,150/Math.max(img.width,img.height));
  c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
  const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height).data,px=[];
  for(let i=0;i<d.length;i+=4)if(d[i+3]>128)px.push([d[i],d[i+1],d[i+2]]);
  const dist=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
  const cs=[px[Math.floor(Math.random()*px.length)].slice()];
  while(cs.length<k){
    const ds=px.map(p=>Math.min(...cs.map(cc=>dist(p,cc))));const tot=ds.reduce((a,b)=>a+b,0);
    let r=Math.random()*tot,i=0;while(r>ds[i]&&i<ds.length-1){r-=ds[i];i++}cs.push(px[i].slice());
  }
  for(let it=0;it<15;it++){
    const sum=cs.map(()=>[0,0,0,0]);
    for(const p of px){let bi=0,bd=1e12;cs.forEach((cc,j)=>{const dd=dist(p,cc);if(dd<bd){bd=dd;bi=j}});const s=sum[bi];s[0]+=p[0];s[1]+=p[1];s[2]+=p[2];s[3]++}
    sum.forEach((s,j)=>{if(s[3])cs[j]=[s[0]/s[3],s[1]/s[3],s[2]/s[3]]});
  }
  // final assignment to get each cluster's share of the image
  const cnt=cs.map(()=>0);
  for(const p of px){let bi=0,bd=1e12;cs.forEach((cc,j)=>{const dd=dist(p,cc);if(dd<bd){bd=dd;bi=j}});cnt[bi]++}
  return cs.map((cc,j)=>({hex:rgbToHex(...cc),w:cnt[j]/px.length})).sort((a,b)=>hexToHSL(b.hex).l-hexToHSL(a.hex).l);
}

/* ---------- swatch interactions: click copies, double-click promotes to base ---------- */
function bindSwatch(el,getHex){
  let t=null;
  el.addEventListener('click',()=>{
    clearTimeout(t);
    t=setTimeout(()=>{const h=getHex();copy(h,'Copied '+h)},230);
  });
  el.addEventListener('dblclick',e=>{clearTimeout(t);promote(getHex(),e.clientX,e.clientY)});
}
function promote(hex,x,y){
  // show the Code field so the color has somewhere to land
  const codeTab=document.getElementById('tab-code');
  if(codeTab.getAttribute('aria-selected')!=='true')codeTab.click();
  const chip=document.querySelector('.code-field .chip').getBoundingClientRect();
  const dot=document.createElement('div');dot.className='flyer';dot.style.background=hex;
  const size=56;Object.assign(dot.style,{left:(x-size/2)+'px',top:(y-size/2)+'px',width:size+'px',height:size+'px'});
  document.body.appendChild(dot);
  if(reduceMotion){dot.remove();land(hex);return}
  const dx=chip.left+chip.width/2-x,dy=chip.top+chip.height/2-y,k=chip.width/size;
  dot.animate([
    {transform:'translate(0,0) scale(1)',opacity:1},
    {transform:`translate(${dx*.55}px,${dy*.62}px) scale(.8)`,opacity:1,offset:.6},
    {transform:`translate(${dx}px,${dy}px) scale(${k})`,opacity:1}
  ],{duration:620,easing:'cubic-bezier(.6,0,.2,1)'}).onfinish=()=>{dot.remove();land(hex)};
}
function land(hex){
  fromBase(hex);
  const f=document.querySelector('.code-field');f.classList.remove('landed');void f.offsetWidth;f.classList.add('landed');
  toast(hex+' is the new base');

/* ---------- render ---------- */
const stage=document.getElementById('stage');
let palette=[],baseHex='#EBC05A',baseIndex=-1;

function render(colors,bIdx){
  palette=colors;baseIndex=bIdx;
  const fresh=stage.children.length!==colors.length;
  if(fresh){stage.innerHTML='';colors.forEach((_,i)=>{
    const p=document.createElement('div');p.className='pill';p.tabIndex=0;p.setAttribute('role','button');
    p.style.zIndex=colors.length-i;p.style.animationDelay=(i*70)+'ms';
    p.innerHTML='<div class="label"></div>';

    bindSwatch(p,()=>palette[i]);

    stage.appendChild(p);
  })}
  colors.forEach((hex,i)=>{
    const p=stage.children[i],lab=p.firstChild,{r,g,b}=hexToRgb(hex),info=describe(hex);

function theme(colors){

const M={pw:0,step:0,G:0,off:0,vertical:false};
function layout(){
  const W=stage.clientWidth,n=stage.children.length;if(!n)return;
  const vertical=W<640;stage.classList.toggle('vertical',vertical);M.vertical=vertical;
  if(!vertical){
    const r=.7,gr=.3,pw=W/(1+(n-1)*r+gr*r),step=pw*r,G=step*gr,ph=Math.min(pw*2.9,600);
    Object.assign(M,{pw,step,G,off:G/2});
    stage.style.height=ph+'px';
    [...stage.children].forEach((p,i)=>{
      Object.assign(p.style,{left:(G/2+i*step)+'px',top:'0px',width:pw+'px',height:ph+'px'});
      const lab=p.firstChild,x0=i===0?pw*.14:pw-step+step*.1;
      Object.assign(lab.style,{left:x0+'px',width:(i===0?pw*.72:step*.82)+'px',bottom:pw*.5+'px',top:'auto'});
    });
  }else{
    const ph=104,step=66,G=18,H=ph+step*(n-1)+G;
    Object.assign(M,{pw:ph,step,G,off:G/2});
    stage.style.height=H+'px';
    [...stage.children].forEach((p,i)=>{
      Object.assign(p.style,{left:'0px',top:(G/2+i*step)+'px',width:W+'px',height:ph+'px'});
      const lab=p.firstChild,y0=i===0?18:ph-step+12;
      Object.assign(lab.style,{left:ph*.45+'px',width:(W-ph*.9)+'px',top:y0+'px',bottom:'auto'});
    });
  }
}

/* ---------- reference weights: circles sized by share of the photo, floating ---------- */
let lastWeights=null;
function showWeights(url,ex){
  lastWeights=ex;
  document.getElementById('refImg').style.backgroundImage='url('+url+')';
  document.getElementById('weights').hidden=false;
  placeOrbs();
}
function placeOrbs(){
  if(!lastWeights)return;
  const field=document.getElementById('field');field.innerHTML='';
  const W=field.clientWidth,H=field.clientHeight;
  const items=[...lastWeights].sort((a,b)=>b.w-a.w);
  // area ∝ weight; scale so circles cover ~30% of the field
  const totalW=items.reduce((a,b)=>a+b.w,0);
  const K=Math.sqrt(W*H*.3/(Math.PI*totalW));
  const minR=34;   // smallest circle still fits % and HEX inside
  const orbs=items.map((it,i)=>{
    const r=Math.max(minR,Math.sqrt(it.w)*K);
    // seeded start: spiral around the centre, biggest in the middle
    const a=i*2.4,d=i===0?0:Math.min(W,H)*.12*Math.sqrt(i);
    return{...it,r,x:W/2+Math.cos(a)*d*1.6,y:H/2+Math.sin(a)*d*.8};
  });
  const gap=16;
  for(let it=0;it<400;it++){
    for(let i=0;i<orbs.length;i++)for(let j=i+1;j<orbs.length;j++){
      const A=orbs[i],B=orbs[j];let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||.01;
      const min=A.r+B.r+gap;
      if(d<min){const push=(min-d)/2;dx/=d;dy/=d;A.x-=dx*push;A.y-=dy*push;B.x+=dx*push;B.y+=dy*push}
    }
    for(const o of orbs){
      o.x+=(W/2-o.x)*.004;o.y+=(H/2-o.y)*.01;
      o.x=Math.max(o.r+4,Math.min(W-o.r-4,o.x));o.y=Math.max(o.r+10,Math.min(H-o.r-10,o.y));
    }
  }
  orbs.forEach((o,i)=>{
    const el=document.createElement('div');el.className='orb';el.tabIndex=0;el.setAttribute('role','button');
    el.title='Click to copy · Double-click to use as base';
    el.setAttribute('aria-label',o.hex+', '+Math.round(o.w*100)+' percent of the photo');
    Object.assign(el.style,{left:(o.x-o.r)+'px',top:(o.y-o.r)+'px',width:o.r*2+'px',height:o.r*2+'px',background:o.hex});
    el.style.setProperty('--dur',(5.5+((i*1.7)%3.5)).toFixed(2)+'s');
    el.style.setProperty('--delay',(-(i*1.3)%5).toFixed(2)+'s');
    el.style.setProperty('--amp',(5+o.r*.06).toFixed(1)+'px');
    el.style.setProperty('--sway',((i%2?1:-1)*(2+i%3)).toFixed(0)+'px');
    const pct=o.w*100;
    const ink=luminance(o.hex)>.42?'rgba(20,14,10,.85)':'rgba(255,250,244,.94)';
    const big=Math.max(13,Math.min(30,o.r*.3));
    el.innerHTML='<span class="orb-tag" style="color:'+ink+'"><b style="font-size:'+big.toFixed(1)+'px">'+(pct<1?pct.toFixed(1):Math.round(pct))+'%</b><span>'+o.hex+'</span></span>';
    bindSwatch(el,()=>o.hex);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();copy(o.hex,'Copied '+o.hex)}});
    field.appendChild(el);
  });
}

/* ---------- motion: index-card accordion — the stack parts on its own axis ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let pointer=null,active=-1;const cur=[];
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();pointer={x:e.clientX-r.left,y:e.clientY-r.top}});
stage.addEventListener('pointerleave',()=>{pointer=null});
const ease=.2;
function tick(){
  const pills=[...stage.children],n=pills.length;
  if(n&&M.step){
    // which capsule's visible strip is under the cursor
    let idx=-1;
    if(pointer){
      const pos=(M.vertical?pointer.y:pointer.x)-M.off;
      // strip of capsule 0 is [0,pw); capsule i>0 owns [pw+(i-1)step, pw+i*step)
      idx=pos<M.pw?0:Math.min(n-1,Math.floor((pos-M.pw)/M.step)+1);
      if(pos<-M.off||pos>M.pw+(n-1)*M.step+M.off)idx=-1;
    }
    if(idx!==active){
      active=idx;
      stage.classList.toggle('focusing',idx>=0);
      pills.forEach((p,i)=>{p.classList.toggle('on',i===idx);p.style.zIndex=i===idx?100:n-i});
    }
    pills.forEach((p,i)=>{
      // capsules before the active one slide back, the active one and after slide forward
      const target=(idx<0||reduce)?0:(i<idx?-M.G/2:M.G/2);
      const sc=(idx===i&&!reduce)?1.07:1;
      const t=cur[i]||(cur[i]={v:0,s:1});
      t.v+=(target-t.v)*ease;t.s+=(sc-t.s)*ease;
      p.style.transform=(M.vertical?`translateY(${t.v.toFixed(2)}px)`:`translateX(${t.v.toFixed(2)}px)`)+` scale(${t.s.toFixed(4)})`;
    });
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- SVG for Figma: paste on the canvas, each capsule is a named layer ---------- */
document.getElementById('copySvg').addEventListener('click',()=>{
  const pw=160,step=112,ph=440,pad=40,n=palette.length,w=pad*2+pw+step*(n-1),h=ph+pad*2;
  let shapes='';
  for(let i=n-1;i>=0;i--){
    const hex=palette[i],{r,g,b}=hexToRgb(hex),info=describe(hex),x=pad+i*step;
    const ink=luminance(hex)>.42?'#1A140E':'#FFFAF4',tx=x+(i===0?28:pw-step+12),ty=pad+ph-pw*.5;
    shapes+=`<g id="${hex}">`+
      `<rect id="${hex} capsule" x="${x}" y="${pad}" width="${pw}" height="${ph}" rx="${pw/2}" fill="${hex}"/>`+
      `<text x="${tx}" y="${ty-36}" font-family="Space Mono, monospace" font-size="13" font-weight="700" fill="${ink}">${hex}</text>`+
      `<text x="${tx}" y="${ty-18}" font-family="Space Mono, monospace" font-size="10" fill="${ink}">RGB ${r} ${g} ${b}</text>`+
      `<text x="${tx}" y="${ty}" font-family="Space Mono, monospace" font-size="10" fill="${ink}">${info.pantone?info.pantone+' ':''}${info.name}</text>`+
      `</g>`;
  }
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><g id="Complementary · ${HARMONIES[harmony].name} · ${baseHex}">${shapes}</g></svg>`;
  copy(svg,'SVG copied. Paste into Figma with Cmd+V');
});

// show focus rings only after the keyboard is used
addEventListener('keydown',e=>{if(e.key==='Tab')document.body.classList.add('kbd')});
addEventListener('pointerdown',()=>document.body.classList.remove('kbd'));

fromBase('#EBC05A');
</script>
</body>
</html>
